title: Forks 
# See: https://github.com/ipfs-shipyard/ipfs-css/blob/main/theme.json
color: navy
# See: https://github.com/ipfs-shipyard/ipfs-css/tree/main/icons
icon: stroke_server
description: Interesting codebase forks, and third-party deployed instances.
content:
  - title: "Tolerance Carousel"
    source: "https://github.com/tolerance-carousel/polis_tolerance-carousel"
    picture: "/images/tolerance-carousel.jpg"
    date: "2022-07"
    description: >
      Code for deployed fork of Polis that paired with the Tolerance Carousel project.
  - title: "Demos UK"
    website: "https://demos.co.uk/research/polis-and-the-political-process/"
    source: "https://github.com/Demos-thinktank/polis/tree/demos-dev"
    date: "2020-08"
    picture: "https://demos.co.uk/wp-content/themes/demos/assets//images/logo.svg"
    description: >
      Polis fork run by the UK thinktank Demos.
  - title: "Metropolis"
    website: "https://poll.fil.org"
    source: "https://github.com/canvasxyz/metropolis"
    picture: ""
    date: "2024-11"
    description: >
      A new Polis frontend and collective-response tool, funded for Filecoin
      governance and integrated with GitHub.
  - title: "Fork: Demdis"
    website: "https://www.demdis.sk/"
    source: "https://github.com/Demdis/polis"
    picture: "https://www.demdis.sk/content/images/2022/12/demdis-logo-1.png"
    date: "2023-10"
    description: >
      A Slovakian fork seeking to build a community around better ways of
      engaging in divisive conversations.
  - title: "Fork: Kennislink"
    website: "https://polis.nemokennislink.nl/home"
    source: "https://github.com/Simon-Dirks/polis/tree/kennislink"
    date: "2023-10"
    description: >
      A Dutch fork seeking to build a community around better ways of
      engaging in divisive conversations.
  - title: "Pushing Together (EJ Platform)"
    website: "https://www.ejparticipe.org/docs"
    source: "https://github.com/ejplatform"
    picture: "https://avatars.githubusercontent.com/u/37082640?s=200&v=4"
    date: "2023-05"
    description: >
      A comprehensive platform and funded project to create a social
      participation app, reimplementing Polis. (Brazil)
  - title: "Pentano"
    source: "https://gitlab.com/pentano"
    picture: "https://avatars.githubusercontent.com/u/37082640?s=200&v=4"
    date: "2017-06"
    description: >
      An early iteration of the Pushing Together reimplementation of Polis.
      (Brazil)
  - title: "DFE-Digital/polis-whitelabel"
    website: "https://openpolicy.blog.gov.uk/2023/08/08/a-creative-technologist-working-in-policy-one-year-in/"
    source: "https://github.com/DFE-Digital/polis-whitelabel"
    picture: "https://openpolicy.blog.gov.uk/wp-content/uploads/sites/35/2016/07/Policy-Lab-Logo.jpeg"
    date: "2023-07"
    description: >
      A pared-down fork of Polis created by the Gov.UK Policy Lab
  - title: "Polis deployment: Crowd Wisdom Project"
    website: "https://polis.crowdwisdomproject.org/home"
    source: "https://github.com/NewRedo/polis-fork"
    picture: ""
    date: "2021-03"
    description: >
      An unmodified deployment of the Polis codebase, hosted by the UK-based Crowd Wisdom Project.
  - title: "Polis deployment: Polis.tw"
    website: "https://polis.tw/home"
    source: "https://github.com/PDIS/polis2023"
    picture: ""
    date: "2023-08"
    description: >
      An slightly modified deployment of the Polis codebase, hosted by PDIS.tw,
      a division of the Taiwanese national government.
  - title: "CodeWithAloha/HIERR"
    website: "https://hierr-histategis.hub.arcgis.com/"
    source: "https://github.com/CodeWithAloha/HIERR"
    picture: "https://raw.githubusercontent.com/CodeWithAloha/HIERR/refs/heads/main/docs/logos/hierr.png"
    date: "2024-10"
    description: >
      Hawaiʻi Economic Recovery & Resilience (HIERR) is a digital engagement
      platform wrapping around Polis and providing onboarding materials to
      solicit resident sentiments on vision and value statements for Hawaii's
      economic future.
  - title: "Fork: sirodoht/suburb"
    source: "https://github.com/sirodoht/suburb/"
    date: "2022-11"
    description: >
      Suburb is an experimental fork of Polis, with cleanup in code and
      infrastructure requirements.
  - title: "Fork: PolisOrbis"
    source: "https://gitlab.com/copernicani/polisorbis/codebase"
    website: "https://doc.polisorbis.copernicani.it/overview/"
    date: "2024-09"
    description: >
      PolisOrbis is a Polis fork with extensive rewrites, aiming for GDPR
      compliance, OpenID Connect auth support, and improved docs, among other
      things.
  - title: "Agora Citizen Network"
    source: "https://github.com/zkorum/zkorum"
    website: "https://agoracitizen.network/"
    date: "2024-11"
    picture: "/images/agora-korum.png"
    description: >
      Agora is a Polis-inspired platform that enables citizens, organizations,
      and governments to engage in meaningful large-scale discussions on social
      and political issues.
  - title: "Fork: InnoPolis"
    source: "https://github.com/PassKeyRa/innopolis-report"
    website: "https://ethglobal.com/showcase/innopolis-u2dx0"
    date: "2024-11"
    description: >
      A decentralized version of Pol.is built on Ethereum, for community
      engagement and decision-making with ML-powered opinion analysis.
  - title: "Fork: Polis DigiFinland v1"
    website: "https://www.sitra.fi/en/projects/polis-platform-experiments/"
    source: "https://github.com/jylaroti/polis-digifinland-tools/"
    picture: "https://www.businessfinland.fi/4a969e/contentassets/9ac86913aefe4730a93a5f7b3cbbcd87/companylogo2"
    date: "2023-04"
    description: >
      An initial V1 set of deploy scripts, settings files, custom patches,
      translations and utilities for running Polis experiment deployments for
      DigiFinland.
  - title: "Fork: Polis DigiFinland v2"
    website: "https://www.sitra.fi/en/projects/polis-platform-experiments/"
    source: "https://github.com/polis-digifinland/polis-digifinland"
    picture: "https://www.businessfinland.fi/4a969e/contentassets/9ac86913aefe4730a93a5f7b3cbbcd87/companylogo2"
    date: "2024-09"
    description: >
      A current V2 set of deploy scripts, settings files, custom patches,
      translations and utilities for running Polis experiment deployments for
      DigiFinland.
  - title: "Red-Dwarf: Polis algorithm Python library"
    source: "https://github.com/patcon/red-dwarf"
    date: "2025-02"
    description: >
      A DIMensional REDuction library for stellarpunk democracy into the long
      haul. Goal is re-implementing Polis algorithms in Python, supporting
      easily-tuned variables and alternative dimensional reduction algorithms.
  - title: "Fork: DigiFinland User Interface"
    source: "https://github.com/polis-digifinland/df-participation"
    website: "https://digifinland.fi/toimintamme/polis-kansalaiskeskustelualusta/"
    date: "2025-02"
    description: >
      An in-progress experimental participation interface for Polis, built in
      partnership between DigiFinland and the SITRA fund.
