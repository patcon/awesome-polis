description: Official resources stewarded by Computational Democracy Project.
content:
  - title: Pol.is
    website: https://pol.is/home
    source: https://github.com/compdemocracy/polis
    picture: "/images/polis-banner.jpeg"
    description: Open Source AI for large scale open ended feedback
  - title: "Polis Knowledge Base"
    website: "https://compdemocracy.org/knowledge-base"
    picture: "/images/polis-banner.jpeg"
    date: "2024"
    description: >
      The Computational Democracy Project maintains an extensive (and growing)
      knowledge base for Polis and related facilitation methods.
  - title: "Guide: Integrating Polis with Citizens Assemblies"
    website: "https://compdemocracy.org/polis/book/lottery-selected-assemblies/"
    picture: "/images/polis-banner.jpeg"
    description: >
      A guide for those who are thinking about the interaction between
      techniques for listening at scale and in-person deliberation
  - title: "Official Guide to Polis Methods v1"
    website: "https://compdemocracy.org/polis/book/introduction/"
    picture: "/images/polis-banner.jpeg"
    description: >
      The table of contents for an incomplete stub of a currently unpublished
      Polis book.
  - title: "Polis Embed Examples"
    source: "https://github.com/compdemocracy/polis-embed-examples"
    picture: "/images/polis-banner.jpeg"
    date: "2023-07"
    description: >
      Examples illustrating how to embed a Polis conversation in another
      website.
  - title: "compdemocracy/scripts"
    source: "https://github.com/compdemocracy/scripts"
    picture: ""
    date: "2023-01"
    description: >
      Scripts to streamline the running of the pol.is instance used in Policy Lab. Some of these will become features later on.
  - title: "compdemocracy/openData"
    source: "https://github.com/compdemocracy/openData"
    picture: "/images/polis-banner.jpeg"
    date: "2024-10"
    description: >
      Data exports from select "open data" Polis conversations
